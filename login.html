<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Tigu Seratega</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="src/css/login.css">
    <link rel="icon" href="public/icon.png"> </head>

<body>
    <div class="card glass-panel">
        <h1 class="text-center" style="margin-bottom: 0.5rem;">Welcome Back</h1>
        <p class="text-center" style="color: var(--text-muted); margin-bottom: 2rem;">Sign in to continue</p>
        <div class="flex gap-2" style="background: var(--bg-body); padding: 0.375rem; border-radius: 0.5rem; margin-bottom: 2rem;">
            <button type="button" onclick="setLoginRole('taker')" id="login-taker" class="btn role-btn active">Taker</button>
            <button type="button" onclick="setLoginRole('provider')" id="login-provider" class="btn role-btn">Provider</button>
        </div>
        <form onsubmit="handleLogin(event)">
            <input type="hidden" id="loginRole" value="taker">
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="loginPhone" required placeholder="+251 91 123 4567">
            </div>
            <div class="form-group hidden" id="login-password-group">
                <label>Password *</label>
                <input type="password" id="loginPassword" placeholder="Enter your password"> </div>
            <button type="submit" id="loginBtn" class="btn btn-primary w-full">Sign In</button>
        </form>
        <p class="text-center" style="margin-top: 1.5rem; font-size: 0.875rem;">Don't have an account? <a href="create.html" style="color: var(--primary); font-weight: 700;">Create one</a></p>
    </div>
    <div id="error-popup" class="modal-overlay hidden">
        <div class="modal-box glass-panel text-center">
            <div class="error-icon"><i data-lucide="alert-circle"></i></div>
            <h2 style="margin-bottom: 1rem; color: #ef4444;">Incorrect Password</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">The password you entered is incorrect. Please try again.</p>
            <button onclick="closeErrorPopup()" class="btn btn-primary w-full" style="background: #ef4444;">Try Again</button>
        </div>
    </div>
    <div id="toast-container" style="position: fixed; bottom: 2rem; right: 2rem; z-index: 999;"></div>
    <script src="src/js/login.js"></script>
</body>

</html>
