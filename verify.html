<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying | Tigu Seratega</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="src/css/verify.css">
    <link rel="icon" href="public/icon.png">
</head>
<body>
    <div class="card glass-panel text-center">
        <div id="status-icon-container" class="icon-container">
            <div id="spinner" class="spinner"></div>
            <i data-lucide="shield-check" id="status-icon"></i>
        </div>
        <h1 id="main-title" style="margin-bottom: 0.75rem;">Verifying Status...</h1>
        <p id="status-text" style="color: var(--text-muted); margin-bottom: 2rem;">Please wait while we check your account status.</p>
        <div id="status-badge" class="badge">Status: Pending</div>
    </div>
    <script src="src/js/verify.js"></script>
</body>
</html>
