<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Tigu Seratega</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="src/css/create.css">
    <link rel="icon" href="public/icon.png"> </head>

<body>
    <div class="card glass-panel">
        <h1 class="text-center" style="margin-bottom: 0.5rem;">Join the Network</h1>
        <p class="text-center" style="color: var(--text-muted); margin-bottom: 2rem;">Create your account in seconds.</p>
        <div class="flex gap-2" style="background: rgba(0,0,0,0.05); padding: 0.375rem; border-radius: 0.5rem; margin-bottom: 2rem;">
            <button type="button" onclick="setRole('taker')" id="btn-taker" class="btn role-btn active">Service Taker</button>
            <button type="button" onclick="setRole('provider')" id="btn-provider" class="btn role-btn">Service Provider</button>
        </div>
        <form id="regForm" onsubmit="handleRegister(event)">
            <input type="hidden" id="role" value="taker">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="name" required class="input-field" placeholder="Abebe Bikila">
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="phone" required class="input-field" placeholder="+251 91 123 4567">
            </div>
            <div class="form-group">
                <label>Gender *</label>
                <div class="gender-selector">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="Male" required><span class="gender-box"><i data-lucide="user"></i> Male</span></label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="Female" required><span class="gender-box"><i data-lucide="user"></i> Female</span></label>
                </div>
            </div>
            <div class="form-group relative">
                <label>City / Location</label>
                <input type="text" id="location" autocomplete="off" oninput="filterCities()" placeholder="Start typing your city...">
                <ul id="city-list" class="glass-panel hidden" style="position: absolute; width: 100%; z-index: 20; margin-top: 0.5rem; max-height: 200px; overflow-y: auto; padding: 0; border: 1px solid var(--border); border-radius: 0.5rem;"></ul>
            </div>
            <div id="provider-fields" class="hidden">
                <div class="form-group">
                    <label>Create Password *</label>
                    <input type="password" id="password" placeholder="Create a strong password">
                </div>
                <div class="form-group">
                    <label>Services You Provide *</label>
                    <div class="tag-container" id="tag-container">
                        <input type="text" id="tag-input" placeholder="Type service, press comma or Enter..." autocomplete="off">
                    </div>
                    <input type="hidden" id="services-hidden" required> </div>
                <div class="form-group">
                    <label>Bio / Experience *</label>
                    <textarea id="bio" rows="3" class="input-field" placeholder="Tell clients about your skills..."></textarea>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn-primary w-full" style="margin-top: 1rem;">Create Account</button>
        </form>
        <p class="text-center" style="margin-top: 1.5rem; font-size: 0.875rem;">Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign In</a></p>
    </div>
    <div id="toast-container"></div>
    <script src="src/js/create.js"></script>
</body>

</html>
