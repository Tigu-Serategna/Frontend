<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Studio | Tigu Seratega</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css"> </head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo" onclick="window.location.href='index.html'">
                <div class="logo-icon">TS</div>
                <div class="logo-text">
                    <h1>Provider Studio</h1></div>
            </div>
            <div id="nav-right-auth" class="nav-actions">
                <button onclick="toggleTheme()" style="padding: 0.5rem; color: var(--text-muted);"><i data-lucide="sun" class="hidden dark:block"></i><i data-lucide="moon" class="block dark:hidden"></i></button>
                <button onclick="logout()" style="padding: 0.5rem; color: var(--text-muted);"><i data-lucide="log-out"></i></button>
            </div>
        </div>
    </nav>
    <main class="container" style="padding: 2rem 1.5rem; flex: 1;">
        <div class="profile-header">
            <div class="flex items-center gap-6">
                <div class="avatar-lg"><img id="user-avatar" src="https://via.placeholder.com/150" alt="Profile"></div>
                <div>
                    <div class="flex items-center gap-3" style="margin-bottom: 0.5rem;">
                        <h2 style="font-size: 1.75rem;" id="user-name">Provider</h2><span class="badge badge-gold" id="plan-badge">[F] Trial</span></div>
                    <div class="flex gap-4 text-sm text-muted font-bold"><span class="flex items-center gap-1"><i data-lucide="phone" style="width: 16px;"></i> <span id="user-phone">...</span></span><span class="flex items-center gap-1"><i data-lucide="map-pin" style="width: 16px;"></i> <span id="user-location">...</span></span>
                    </div>
                </div>
            </div>
            <button onclick="openModal('edit-modal')" class="btn btn-outline">Edit Profile</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card premium-card">
                <h3 class="stat-label">Rating</h3>
                <p class="stat-value" id="stat-rating">5.0</p>
            </div>
            <div class="stat-card premium-card">
                <h3 class="stat-label" style="color: var(--gold);">Active Jobs</h3>
                <p class="stat-value gold" id="stat-jobs">0</p>
            </div>
            <div class="stat-card premium-card">
                <h3 class="stat-label" style="color: var(--brand);">Proposals</h3>
                <p class="stat-value green" id="stat-proposals">0</p>
            </div>
            <div class="stat-card premium-card">
                <h3 class="stat-label" style="color: #ef4444;">Completed</h3>
                <p class="stat-value red" id="stat-completed">0</p>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-8">
            <div>
                <div class="card">
                    <h3 style="margin-bottom: 1.25rem;">Post a New Job</h3>
                    <form onsubmit="createJob(event)">
                        <div class="form-group">
                            <label class="form-label">Job Title *</label>
                            <input type="text" id="job-title" required class="input-field" placeholder="Villa Wiring">
                        </div>
                        <div class="form-group">
                            <label class="form-label">City *</label>
                            <input type="text" id="job-city" required class="input-field" placeholder="Bole, Addis Ababa">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="form-group">
                                <label class="form-label">Budget (ETB) *</label>
                                <input type="number" id="job-budget" required class="input-field" placeholder="12500">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Vacancies *</label>
                                <input type="number" id="job-vacancies" required class="input-field" placeholder="1">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description *</label>
                            <textarea id="job-desc" required rows="3" class="input-field" placeholder="Requirements..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-shimmer w-full">Publish Job</button>
                    </form>
                </div>
            </div>
            <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 2rem;">
                <div class="card">
                    <h3 style="margin-bottom: 1.25rem;">Candidate Proposals</h3>
                    <div id="proposals-list" class="flex flex-col gap-3">
                        <p class="text-sm font-bold text-muted">No proposals yet.</p>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom: 1.25rem;">Incoming Service Orders</h3>
                    <div id="incoming-orders-list" class="flex flex-col gap-3">
                        <p class="text-sm font-bold text-muted">No incoming orders.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="edit-modal" class="modal">
        <div class="modal-overlay" onclick="closeModal('edit-modal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 1.25rem;">Edit Profile</h3>
                <button class="modal-close" onclick="closeModal('edit-modal')"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <form onsubmit="saveProfile(event)">
                    <div class="text-center" style="margin-bottom: 1.5rem;">
                        <div style="width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--brand); overflow: hidden; background: var(--bg-body); margin: 0 auto 0.5rem;"><img id="edit-img-preview" src="https://via.placeholder.com/150" style="width: 100%; height: 100%; object-fit: cover;"></div>
                        <label style="cursor: pointer; font-size: 0.75rem; font-weight: 800; color: var(--brand);">Upload New Photo
                            <input type="file" id="edit-img-file" accept="image/*" style="display: none;" onchange="previewImage(event)">
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="edit-name" required class="input-field">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" id="edit-phone" required class="input-field">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Service Provided *</label>
                        <input type="text" id="edit-service" required class="input-field">
                    </div>
                    <div class="form-group" style="position: relative;">
                        <label class="form-label">Location (Optional)</label>
                        <input type="text" id="edit-location" autocomplete="off" oninput="renderCityList('edit-location', 'edit-city-list')" class="input-field" placeholder="Start typing city...">
                        <ul id="edit-city-list" class="card hidden" style="position: absolute; width: 100%; z-index: 20; margin-top: 0.5rem; max-height: 200px; overflow-y: auto; padding: 0;"></ul>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bio *</label>
                        <textarea id="edit-bio" required rows="3" class="input-field"></textarea>
                    </div>
                    <button type="submit" id="save-profile-btn" class="btn btn-shimmer w-full" style="margin-top: 1rem;">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
    <div id="chat-modal" class="modal">
        <div class="modal-overlay" onclick="closeModal('chat-modal')"></div>
        <div class="modal-content flex flex-col" style="height: 600px; max-height: 90vh;">
            <div class="modal-header" style="background: var(--bg-body);">
                <div>
                    <h3 id="chat-title">Chat</h3>
                    <p class="text-xs text-muted font-bold">Order #<span id="chat-order-id"></span></p>
                </div>
                <button class="modal-close" onclick="closeModal('chat-modal')"><i data-lucide="x"></i></button>
            </div>
            <div id="chat-box" style="flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; background: var(--bg-body);"></div>
            <form onsubmit="sendChatMessage(event)" class="flex gap-2" style="padding: 1rem; border-top: 1px solid var(--border);">
                <input type="text" id="chat-input" required class="input-field" placeholder="Type a message..." style="border-radius: var(--radius-full);">
                <button type="submit" class="btn btn-primary" style="border-radius: 50%; padding: 0.75rem;"><i data-lucide="send"></i></button>
            </form>
        </div>
    </div>
    <div id="toast-container"></div>
    <script src="shared.js"></script>
    <script>
    let user = getUser(),
        activeChatOrderId = null;
    document.addEventListener('DOMContentLoaded', async() => {
        lucide.createIcons();
        if(!user) {
            window.location.href = 'login.html';
            return;
        }
        const daysLeft = calculateDaysLeft(user.planExpiry);
        const planName = user.plan === 'A' ? 'Weekly' : user.plan === 'B' ? 'Monthly' : user.plan === 'C' ? 'VIP Yearly' : user.plan === 'F' ? 'Free Trial' : 'Pending';
        document.getElementById('user-name').innerText = `${user.name} (${planName} - ${daysLeft}d left)`;
        document.getElementById('user-phone').innerText = user.phone;
        document.getElementById('user-location').innerText = user.location || 'Not Set';
        if(user.image) document.getElementById('user-avatar').src = user.image;
        const planMap = {
            'A': '[A] Weekly',
            'B': '[B] Monthly',
            'C': '[C] VIP',
            'F': '[F] Trial'
        };
        document.getElementById('plan-badge').innerText = planMap[user.plan] || '[F] Trial';
        const propRes = await apiCall('getProposals', {
            phone: user.phone
        });
        if(propRes.status === 'success' && propRes.data.length > 0) {
            document.getElementById('proposals-list').innerHTML = propRes.data.map(p => `<div class="card" style="padding: 1rem; background: var(--bg-body);"><p class="font-bold text-sm">${p.applicantName}</p><p class="text-xs text-muted" style="margin-top: 0.25rem;">${p.coverNote}</p><p class="text-xs font-extrabold" style="color: var(--brand); margin-top: 0.5rem;">Expected: ${p.expectedPay} ETB</p><div class="flex gap-2" style="margin-top: 0.75rem;"><button onclick="updateProposal('${p.id}', 'Accepted')" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">Accept</button><button onclick="updateProposal('${p.id}', 'Declined')" class="btn" style="background: #ef4444; color: white; padding: 0.25rem 0.75rem; font-size: 0.75rem;">Decline</button></div></div>`).join('');
        }
        const orderRes = await apiCall('getProviderOrders', {
            phone: user.phone
        });
        if(orderRes.status === 'success' && orderRes.data.length > 0) {
            document.getElementById('incoming-orders-list').innerHTML = orderRes.data.map(o => `<div class="card flex justify-between items-center" style="padding: 1rem; background: var(--bg-body);"><div><p class="font-bold text-sm">${o.takerName}</p><p class="text-xs text-muted" style="margin-top: 0.25rem;">${o.service}</p></div><div class="flex gap-2">${o.status === 'pending' ? ` < button onclick = "updateOrder('${o.id}', 'accepted')"
                class = "btn btn-primary"
                style = "padding: 0.5rem 1rem; font-size: 0.8rem;" > Accept < /button><button onclick="updateOrder('${o.id}', 'declined')" class="btn" style="background: #ef4444; color: white; padding: 0.5rem 1rem; font-size: 0.8rem;">Decline</button > ` : ` < button onclick = "openChat('${o.id}', '${o.takerName}')"
                class = "btn btn-primary"
                style = "padding: 0.5rem 1rem; font-size: 0.8rem;" > < i data - lucide = "message-circle"
                style = "width: 14px;" > < /i> Chat</button > `}</div></div>`).join('');
            lucide.createIcons();
        }
    });

    function openModal(id) {
        document.getElementById(id).classList.add('show');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
        if(id === 'chat-modal') {
            clearInterval(window.chatInterval);
            activeChatOrderId = null;
        }
    }

    function openEditModal() {
        document.getElementById('edit-name').value = user.name;
        document.getElementById('edit-phone').value = user.phone;
        document.getElementById('edit-service').value = user.service || '';
        document.getElementById('edit-location').value = user.location || '';
        document.getElementById('edit-bio').value = user.bio || '';
        if(user.image) document.getElementById('edit-img-preview').src = user.image;
        openModal('edit-modal');
    }

    function previewImage(e) {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('edit-img-preview').src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    }
    async function saveProfile(e) {
        e.preventDefault();
        const btn = document.getElementById('save-profile-btn');
        btn.disabled = true;
        btn.innerText = 'Saving...';
        const fileInput = document.getElementById('edit-img-file');
        let imageUrl = user.image || '';
        if(fileInput.files.length > 0) {
            const base64 = await fileToBase64(fileInput.files[0]);
            const uploadRes = await apiCall('uploadImage', {
                base64: base64,
                fileName: user.phone
            });
            if(uploadRes.status === 'success') {
                imageUrl = uploadRes.url;
            } else {
                showToast(uploadRes.message || 'Image upload failed', 'alert-circle');
                btn.disabled = false;
                btn.innerText = 'Save Changes';
                return;
            }
        }
        const newName = document.getElementById('edit-name').value;
        const newPhone = document.getElementById('edit-phone').value;
        const newService = document.getElementById('edit-service').value;
        const newLoc = document.getElementById('edit-location').value;
        const newBio = document.getElementById('edit-bio').value;
        const res = await apiCall('updateProfile', {
            oldPhone: user.phone,
            role: 'provider',
            newName: newName,
            newPhone: newPhone,
            service: newService,
            location: newLoc,
            bio: newBio,
            image: imageUrl
        });
        if(res.status === 'success') {
            user.name = newName;
            user.phone = cleanPhone(newPhone);
            user.service = newService;
            user.location = newLoc;
            user.bio = newBio;
            user.image = imageUrl;
            setUser(user);
            document.getElementById('user-name').innerText = newName + ` (${planName} - ${daysLeft}d left)`;
            document.getElementById('user-phone').innerText = newPhone;
            document.getElementById('user-location').innerText = newLoc || 'Not Set';
            if(imageUrl) document.getElementById('user-avatar').src = imageUrl;
            closeModal('edit-modal');
            showToast('Profile updated!', 'check-circle');
        } else {
            showToast('Failed to update.', 'alert-circle');
        }
        btn.disabled = false;
        btn.innerText = 'Save Changes';
    }
    async function updateProposal(propId, status) {
        const res = await apiCall('updateProposalStatus', {
            propId: propId,
            status: status,
            providerName: user.name
        });
        if(res.status === 'success') {
            showToast(`Proposal ${status}!`, 'check-circle');
            setTimeout(() => window.location.reload(), 1000);
        }
    }
    async function updateOrder(id, status) {
        const res = await apiCall('updateOrderStatus', {
            id, status
        });
        if(res.status === 'success') {
            showToast(`Order ${status}!`, 'check-circle');
            setTimeout(() => window.location.reload(), 1000);
        }
    }
    async function createJob(e) {
        e.preventDefault();
        const data = {
            id: 'JOB-' + Math.floor(Math.random() * 10000),
            title: document.getElementById('job-title').value,
            employer: user.name,
            employerPhone: user.phone,
            city: document.getElementById('job-city').value,
            budget: document.getElementById('job-budget').value,
            vacancies: document.getElementById('job-vacancies').value,
            description: document.getElementById('job-desc').value,
            postedAt: new Date().toISOString()
        };
        const res = await apiCall('createJob', data);
        if(res.status === 'success') {
            showToast('Job posted!', 'check-circle');
            e.target.reset();
        }
    }

    function openChat(orderId, takerName) {
        activeChatOrderId = orderId;
        document.getElementById('chat-title').innerText = takerName;
        document.getElementById('chat-order-id').innerText = orderId;
        document.getElementById('chat-box').innerHTML = '<p class="text-center text-xs text-muted">Loading...</p>';
        openModal('chat-modal');
        fetchChatHistory();
        window.chatInterval = setInterval(fetchChatHistory, 3000);
    }
    async function fetchChatHistory() {
        if(!activeChatOrderId) return;
        const res = await apiCall('getChat', {
            orderId: activeChatOrderId
        });
        if(res.status === 'success') {
            const box = document.getElementById('chat-box');
            box.innerHTML = res.data.map(c => {
                const isMe = cleanPhone(c.senderPhone) === cleanPhone(user.phone);
                return `<div style="display: flex; justify-content: ${isMe ? 'flex-end' : 'flex-start'};"><div style="max-width: 75%; padding: 0.75rem; border-radius: 1rem; font-size: 0.9rem; ${isMe ? 'background: var(--brand); color: white; border-bottom-right-radius: 0;' : 'background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 0;'}">${c.message}</div></div>`;
            }).join('');
            box.scrollTop = box.scrollHeight;
        }
    }
    async function sendChatMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const msg = input.value;
        if(!msg || !activeChatOrderId) return;
        input.value = '';
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div style="display: flex; justify-content: flex-end;"><div style="max-width: 75%; padding: 0.75rem; border-radius: 1rem; font-size: 0.9rem; background: var(--brand); color: white; border-bottom-right-radius: 0;">${msg}</div></div>`;
        box.scrollTop = box.scrollHeight;
        await apiCall('sendChat', {
            orderId: activeChatOrderId,
            senderPhone: user.phone,
            message: msg
        });
    }
    </script>
</body>

</html>
